<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Expresso — Pakistan Telecom &amp; Lifestyle</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --primary: #00695c;
      --primary-container: #e0f2f1;
      --on-primary: #ffffff;
      --secondary: #0d47a1;
      --secondary-container: #e3f2fd;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-2: #475569;
      --outline: #cbd5e1;
      --radius: 16px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 74px;
      box-shadow: 0 0 20px rgba(0,0,0,0.06);
    }
    header {
      padding: 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--outline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand-row { display: flex; align-items: center; gap: 10px; }
    .brand-row svg { width: 36px; height: 36px; border-radius: 8px; }
    .brand-title { font-size: 19px; font-weight: 800; color: var(--primary); margin: 0; }
    .brand-sub { font-size: 11px; color: var(--text-2); margin: 0; }
    main { padding: 16px; flex: 1; }
    .card {
      background: #ffffff;
      border: 1px solid var(--outline);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }
    .card.primary-box {
      background: linear-gradient(135deg, #00695c, #004d40);
      color: #ffffff;
      border: none;
    }
    .card.primary-box .text-muted { color: #b2dfdb; }
    .card.notice {
      background: var(--secondary-container);
      border: 1px solid #bbdefb;
      font-size: 12px;
      color: #0d47a1;
      line-height: 1.45;
    }
    .card.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      font-size: 12px;
      color: #b91c1c;
      line-height: 1.45;
    }
    .card.success {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      font-size: 12px;
      color: #047857;
      line-height: 1.45;
    }
    .row { display: flex; align-items: center; justify-content: space-between; }
    .chips-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin: 10px 0; }
    .chip {
      background: #f1f5f9;
      border: 1px solid var(--outline);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.outline { background: transparent; border: 1.5px solid var(--outline); color: var(--text); }
    .btn.secondary { background: var(--secondary); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .link-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--outline);
      border-radius: 10px;
      font-size: 14px;
      margin: 6px 0 12px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }
    .progress-track { background: #e2e8f0; border-radius: 6px; height: 8px; overflow: hidden; margin-top: 6px; }
    .progress-fill { background: var(--primary); height: 100%; }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: var(--primary-container);
      color: var(--primary);
    }
    .badge.admin { background: #fff7ed; color: #c2410c; }
    nav.bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: 64px;
      background: #ffffff;
      border-top: 1px solid var(--outline);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 30;
    }
    .nav-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-2);
      cursor: pointer;
      padding: 4px 8px;
    }
    .nav-btn.active { color: var(--primary); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app">
  <header>
    <div class="brand-row">
      <svg viewBox="0 0 108 108">
        <rect width="108" height="108" rx="20" fill="#00695c"/>
        <path d="M12,64 L96,36 L96,84 A12,12 0 0,1 84,96 L24,96 A12,12 0 0,1 12,84 Z" fill="#0d47a1"/>
        <path d="M34,32 L74,32 L74,41 L44,41 L44,49 L68,49 L68,58 L44,58 L44,67 L74,67 L74,76 L34,76 Z" fill="#ffffff"/>
        <path d="M78,26 A16,16 0 0,1 86,40 L81,40 A11,11 0 0,0 75,30 Z" fill="#4db6ac"/>
      </svg>
      <div>
        <h1 class="brand-title">Expresso</h1>
        <p class="brand-sub">Pakistan Telecom &amp; Lifestyle</p>
      </div>
    </div>
    <div id="topAction"></div>
  </header>

  <main id="mainContent"></main>

  <nav class="bottom-bar" id="bottomNav">
    <button class="nav-btn active" onclick="setRoute('home')"><span>🏠</span>Home</button>
    <button class="nav-btn" onclick="setRoute('packages')"><span>📦</span>Bundles</button>
    <button class="nav-btn" onclick="setRoute('discover')"><span>🧭</span>Discover</button>
    <button class="nav-btn" onclick="setRoute('activity')"><span>📊</span>Activity</button>
    <button class="nav-btn" onclick="setRoute('profile')"><span>👤</span>Profile</button>
  </nav>
</div>

<script>
  // The publishable (anon) key is meant to be public. Every authorisation
  // decision is enforced by Row Level Security in the database, never here.
  const SUPABASE_URL = "https://ryimialrkhmnceupzptg.supabase.co";
  const SUPABASE_KEY = "sb_publishable_UFoJamn09mmH7HLChSzuJg_1LXj1IIq";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

  const UI_STATE_KEY = "expresso_ui_state";
  const PERSISTED_KEYS = [
    "selectedSim", "sims", "selectedCat", "tasbeeh", "streak", "claimedToday", "history", "aiChat"
  ];

  const DEFAULT_STATE = {
    session: null,
    profile: null,
    packages: [],
    packagesError: "",
    authMode: "login",
    authBusy: false,
    authError: "",
    authNotice: "",
    authForm: { email: "", password: "", confirm: "", fullName: "", msisdn: "" },
    adminBusy: false,
    route: "home",
    selectedSim: "+923001234567",
    sims: [
      { num: "+923001234567", name: "Primary SIM", bal: 840, dataMb: 28672, totMb: 40960, mins: 2450, sms: 2800 },
      { num: "+923019876543", name: "Family SIM", bal: 210, dataMb: 0, totMb: 0, mins: 0, sms: 0 }
    ],
    selectedCat: "ALL",
    tasbeeh: 0,
    streak: 4,
    claimedToday: false,
    history: [
      { id: "EXP-RCH-8842", type: "Top-up", amt: 1000, desc: "Sandbox Wallet Top-up" }
    ],
    aiChat: [
      { sender: "Expresso", text: "Assalam-o-Alaikum! Main Expresso AI Assistant hoon. Mujh se apnay balance ya packages ke baray mein Roman Urdu mein poochein." }
    ]
  };

  let state = Object.assign({}, DEFAULT_STATE);
  try {
    const raw = localStorage.getItem(UI_STATE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      // Only non-identity UI preferences are restored. Identity and role always
      // come from Supabase Auth and the profiles table.
      PERSISTED_KEYS.forEach(k => { if (saved[k] !== undefined) state[k] = saved[k]; });
    }
  } catch (e) {}

  function save() {
    try {
      const persisted = {};
      PERSISTED_KEYS.forEach(k => { persisted[k] = state[k]; });
      localStorage.setItem(UI_STATE_KEY, JSON.stringify(persisted));
    } catch (e) {}
  }

  // Discard state written by the earlier demo build, which stored a fake session.
  try { localStorage.removeItem("expresso_app_state"); } catch (e) {}

  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function isAdmin() {
    return !!state.profile && state.profile.role === "RETAILER_ADMIN";
  }

  function displayName() {
    if (state.profile && state.profile.full_name) return state.profile.full_name;
    if (state.session && state.session.user) return state.session.user.email;
    return "Customer";
  }

  function normalizeMsisdn(value) {
    const digits = String(value || "").replace(/[^\d]/g, "");
    if (!digits) return null;
    if (digits.startsWith("92")) return "+" + digits;
    if (digits.startsWith("0")) return "+92" + digits.slice(1);
    return "+92" + digits;
  }

  function mapPackage(row) {
    return {
      id: row.id,
      name: row.title,
      cat: row.category,
      pkr: Number(row.price_pkr) || 0,
      mb: Number(row.data_mb) || 0,
      mins: Number(row.minutes) || 0,
      valid: Number(row.validity_days) === 1 ? "1 Day" : Number(row.validity_days) + " Days",
      enabled: row.is_enabled !== false
    };
  }

  function getActiveSim() {
    return state.sims.find(s => s.num === state.selectedSim) || state.sims[0];
  }

  function setRoute(r) {
    state.route = r;
    save();
    render();
  }

  // --- Data access (rows are filtered by RLS server-side) -------------------
  async function loadProfile() {
    const user = state.session && state.session.user;
    if (!user) { state.profile = null; return; }
    const { data, error } = await supabaseClient
      .from("profiles")
      .select("id, role, full_name, msisdn, is_active")
      .eq("id", user.id)
      .maybeSingle();
    if (error || !data) {
      // Never trust client-side role data: fall back to the least privilege.
      state.profile = {
        id: user.id,
        role: "CUSTOMER",
        full_name: (user.user_metadata && user.user_metadata.full_name) || null,
        msisdn: (user.user_metadata && user.user_metadata.msisdn) || null,
        is_active: true
      };
      return;
    }
    state.profile = data;
  }

  async function loadPackages() {
    let query = supabaseClient
      .from("packages")
      .select("id, title, category, validity_days, price_pkr, data_mb, minutes, is_enabled")
      .order("price_pkr", { ascending: true });
    if (!isAdmin()) query = query.eq("is_enabled", true);
    const { data, error } = await query;
    if (error) {
      state.packagesError = error.message;
      return;
    }
    state.packagesError = "";
    state.packages = (data || []).map(mapPackage);
  }

  async function hydrate() {
    await loadProfile();
    await loadPackages();
  }

  function describeAuthError(error) {
    if (!error) return "Something went wrong. Please try again.";
    const map = {
      invalid_credentials: "Incorrect email or password.",
      email_not_confirmed: "Please confirm your email address before signing in.",
      user_already_exists: "An account with this email already exists.",
      email_exists: "An account with this email already exists.",
      weak_password: "Please choose a password of at least 6 characters.",
      over_email_send_rate_limit: "Too many attempts. Please wait a moment and try again."
    };
    return map[error.code] || error.message || "Authentication failed. Please try again.";
  }

  // --- Auth actions ---------------------------------------------------------
  async function submitAuth() {
    if (state.authBusy) return;
    const form = readAuthForm();
    const { email, password, confirm, fullName, msisdn } = form;

    state.authError = "";
    state.authNotice = "";

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      state.authError = "Please enter a valid email address.";
      render();
      return;
    }
    if (password.length < 6) {
      state.authError = "Password must be at least 6 characters.";
      render();
      return;
    }
    if (state.authMode === "signup") {
      if (!fullName) {
        state.authError = "Please enter your full name.";
        render();
        return;
      }
      if (!msisdn) {
        state.authError = "Please enter a valid mobile number.";
        render();
        return;
      }
      if (password !== confirm) {
        state.authError = "Passwords do not match.";
        render();
        return;
      }
    }

    state.authBusy = true;
    render();

    try {
      if (state.authMode === "signup") {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          // full_name/msisdn are profile details only. The role is set by the
          // database trigger and can never be supplied by the client.
          options: { data: { full_name: fullName, msisdn: normalizeMsisdn(msisdn) } }
        });
        if (error) {
          state.authError = describeAuthError(error);
        } else if (!data.session) {
          state.authMode = "login";
          state.authForm = { email, password: "", confirm: "", fullName: "", msisdn: "" };
          state.authNotice = "Account created. Check your email to confirm your address, then sign in.";
        }
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) state.authError = describeAuthError(error);
      }
    } catch (e) {
      state.authError = "Network error. Please check your connection and try again.";
    } finally {
      state.authBusy = false;
      render();
    }
  }

  function readAuthForm() {
    const val = id => {
      const el = document.getElementById(id);
      return el ? el.value : "";
    };
    const form = {
      email: val("authEmail").trim(),
      password: val("authPassword"),
      confirm: val("authConfirm"),
      fullName: val("authName").trim(),
      msisdn: val("authMsisdn").trim()
    };
    // Mirror into state so a re-render never discards what the user typed.
    state.authForm = form;
    return form;
  }

  function setAuthMode(mode) {
    state.authMode = mode;
    state.authError = "";
    state.authNotice = "";
    state.authForm = Object.assign({}, state.authForm, { password: "", confirm: "" });
    render();
  }

  async function logout() {
    state.authBusy = true;
    render();
    try { await supabaseClient.auth.signOut(); } catch (e) {}
    state.session = null;
    state.profile = null;
    state.packages = [];
    state.route = "home";
    state.authBusy = false;
    render();
  }

  // --- Retailer admin actions (RLS rejects these for customers) -------------
  async function adminCreatePackage() {
    if (!isAdmin() || state.adminBusy) return;
    const title = document.getElementById("pkgTitle").value.trim();
    const category = document.getElementById("pkgCategory").value;
    const price = Number(document.getElementById("pkgPrice").value);
    const dataMb = Number(document.getElementById("pkgData").value) || 0;
    const minutes = Number(document.getElementById("pkgMinutes").value) || 0;
    const validity = Number(document.getElementById("pkgValidity").value) || 1;

    if (!title || !(price > 0)) {
      alert("Please provide a title and a price greater than zero.");
      return;
    }

    state.adminBusy = true;
    render();
    const { error } = await supabaseClient.from("packages").insert({
      title, category, price_pkr: price, data_mb: dataMb, minutes,
      validity_days: validity, is_enabled: true, created_by: state.session.user.id
    });
    state.adminBusy = false;
    if (error) alert("Could not create bundle: " + error.message);
    await loadPackages();
    render();
  }

  async function adminTogglePackage(id, enabled) {
    if (!isAdmin() || state.adminBusy) return;
    state.adminBusy = true;
    render();
    const { error } = await supabaseClient.from("packages").update({ is_enabled: enabled }).eq("id", id);
    state.adminBusy = false;
    if (error) alert("Could not update bundle: " + error.message);
    await loadPackages();
    render();
  }

  // --- Rendering ------------------------------------------------------------
  function render() {
    const nav = document.getElementById("bottomNav");
    const topAction = document.getElementById("topAction");
    const main = document.getElementById("mainContent");

    if (!state.session) {
      nav.style.display = "none";
      topAction.innerHTML = "";
      main.innerHTML = renderAuthScreen();
      return;
    }

    nav.style.display = "flex";
    Array.from(nav.children).forEach((btn, idx) => {
      const routes = ["home", "packages", "discover", "activity", "profile"];
      btn.className = "nav-btn" + (state.route === routes[idx] ? " active" : "");
    });

    topAction.innerHTML = `<button class="btn outline" style="padding:4px 8px;font-size:11px;" onclick="setRoute('ai')">🤖 AI</button>`;

    const sim = getActiveSim();

    if (state.route === "home") {
      main.innerHTML = `
        <div class="row" style="margin-bottom:12px;">
          <div>
            <div style="font-size:13px;color:var(--text-2);">Assalam-o-Alaikum,</div>
            <div style="font-size:18px;font-weight:800;">${escapeHtml(displayName())}</div>
          </div>
          <select style="width:auto;margin:0;padding:6px 10px;font-size:12px;" onchange="state.selectedSim=this.value;save();render();">
            ${state.sims.map(s => `<option value="${escapeHtml(s.num)}" ${s.num===state.selectedSim?'selected':''}>${escapeHtml(s.name)} (${escapeHtml(s.num)})</option>`).join("")}
          </select>
        </div>

        <div class="card primary-box">
          <div class="text-muted" style="font-size:12px;font-weight:600;">SIMULATED BALANCE</div>
          <div style="font-size:32px;font-weight:800;margin:6px 0;">PKR ${sim.bal.toFixed(2)}</div>
          <div class="row">
            <span class="text-muted" style="font-size:11px;">Active SIM: ${escapeHtml(sim.num)}</span>
            <button class="btn" style="background:#fff;color:var(--primary);padding:6px 12px;font-size:12px;" onclick="setRoute('recharge')">+ Recharge</button>
          </div>
        </div>

        ${sim.totMb > 0 ? `
          <div class="card">
            <div class="row"><b>Active Bundles</b><span class="badge">Valid 22 Days</span></div>
            <div style="margin-top:12px;">
              <div class="row" style="font-size:12px;"><span>Internet Data</span><b>${(sim.dataMb/1024).toFixed(1)} GB / ${(sim.totMb/1024).toFixed(1)} GB</b></div>
              <div class="progress-track"><div class="progress-fill" style="width:${(sim.dataMb/sim.totMb)*100}%"></div></div>
            </div>
            <div style="margin-top:10px;">
              <div class="row" style="font-size:12px;"><span>Voice Minutes</span><b>${sim.mins} Mins remaining</b></div>
            </div>
          </div>
        ` : `
          <div class="card" style="border-style:dashed;">
            <b>No Active Bundle on ${escapeHtml(sim.num)}</b>
            <p style="font-size:12px;color:var(--text-2);margin:4px 0 10px;">Base rates se bachne ke liye naya bundle lagayein.</p>
            <button class="btn" style="padding:6px 12px;font-size:12px;" onclick="setRoute('packages')">Explore Recommended Bundles</button>
          </div>
        `}

        <div class="card">
          <div class="row">
            <div>
              <b style="font-size:14px;">Daily Streak Reward</b>
              <div style="font-size:12px;color:var(--text-2);">Day ${state.streak} • 72-Hour Bonus MB</div>
            </div>
            <button class="btn" style="padding:6px 12px;font-size:12px;" onclick="claimStreak()" ${state.claimedToday?'disabled':''}>${state.claimedToday?'Claimed':'Check In'}</button>
          </div>
        </div>
      `;
    } else if (state.route === "packages") {
      const cats = ["ALL", "DAILY", "WEEKLY", "MONTHLY", "CALL", "SOCIAL"];
      const list = state.packages.filter(p => state.selectedCat === "ALL" || p.cat === state.selectedCat);
      main.innerHTML = `
        <h2 style="margin:0 0 10px;font-size:18px;">Bundles Explorer</h2>
        <div class="chips-row">
          ${cats.map(c => `<button class="chip ${state.selectedCat===c?'active':''}" onclick="state.selectedCat='${c}';render();">${c}</button>`).join("")}
        </div>
        ${state.packagesError ? `<div class="card error">Could not load bundles: ${escapeHtml(state.packagesError)}</div>` : ""}
        ${list.length === 0 && !state.packagesError ? `<div class="card notice">No bundles are available right now.</div>` : ""}
        ${list.map(p => `
          <div class="card">
            <div class="row"><b style="font-size:15px;">${escapeHtml(p.name)}</b><span class="badge">PKR ${p.pkr}</span></div>
            <p style="font-size:12px;color:var(--text-2);margin:6px 0 10px;">${(p.mb/1024).toFixed(1)} GB Data • ${p.mins} Mins • ${escapeHtml(p.valid)}</p>
            <button class="btn" style="width:100%;font-size:12.5px;" onclick="subscribePkg('${escapeHtml(p.id)}')">Subscribe (PKR ${p.pkr})</button>
          </div>
        `).join("")}
      `;
    } else if (state.route === "recharge") {
      main.innerHTML = `
        <h2 style="margin:0 0 10px;font-size:18px;">Sandbox Top-up</h2>
        <div class="card">
          <label style="font-size:12px;font-weight:700;">Recipient Number</label>
          <input id="rchNum" value="${escapeHtml(sim.num)}" />
          <label style="font-size:12px;font-weight:700;">Amount in PKR</label>
          <input id="rchAmt" type="number" value="500" />
          <div class="chips-row">
            ${[100, 300, 500, 1000].map(a => `<button class="chip" onclick="document.getElementById('rchAmt').value='${a}'">Rs.${a}</button>`).join("")}
          </div>
          <button class="btn" style="width:100%;margin-top:10px;" onclick="doRecharge()">Confirm PKR Recharge</button>
        </div>
      `;
    } else if (state.route === "discover") {
      main.innerHTML = `
        <h2 style="margin:0 0 10px;font-size:18px;">Discover &amp; Lifestyle</h2>
        <div class="card">
          <span class="badge">FAITH &amp; DHIKR</span>
          <h3 style="margin:8px 0 4px;font-size:16px;">Interactive Digital Tasbeeh</h3>
          <div style="font-size:32px;font-weight:800;color:var(--primary);margin:6px 0;">${state.tasbeeh} / 33</div>
          <div style="display:flex;gap:8px;">
            <button class="btn" onclick="state.tasbeeh+=1;save();render();">+1 SubhanAllah</button>
            <button class="btn outline" onclick="state.tasbeeh=0;save();render();">Reset</button>
          </div>
        </div>
        <div class="card">
          <span class="badge">FINANCE &amp; TAX</span>
          <h3 style="margin:8px 0 4px;font-size:16px;">FBR Telecom Tax Certificate</h3>
          <p style="font-size:12px;color:var(--text-2);margin:4px 0;">Annual 15% Advance Income Tax (Section 236): <b>PKR 1,420.50</b></p>
        </div>
      `;
    } else if (state.route === "activity") {
      main.innerHTML = `
        <h2 style="margin:0 0 10px;font-size:18px;">Recent Activity</h2>
        <div class="card">
          <b>7-Day Telecom Usage Record (${escapeHtml(sim.num)})</b>
          <div style="margin-top:10px;font-size:12.5px;">
            <div class="row"><span>Data Usage</span><b>4.8 GB</b></div>
            <div class="row" style="margin-top:6px;"><span>Voice Minutes</span><b>142 Mins</b></div>
            <div class="row" style="margin-top:6px;"><span>SMS Sent</span><b>88 SMS</b></div>
          </div>
        </div>
        <h3 style="font-size:15px;margin:12px 0 8px;">Transaction Receipts</h3>
        ${state.history.map(h => `
          <div class="card" style="padding:12px;">
            <div class="row"><b>${escapeHtml(h.type)}</b><span class="badge">PKR ${h.amt}</span></div>
            <div style="font-size:11px;color:var(--text-2);margin-top:4px;">Ref: ${escapeHtml(h.id)} • ${escapeHtml(h.desc)}</div>
          </div>
        `).join("")}
      `;
    } else if (state.route === "ai") {
      main.innerHTML = `
        <div class="row" style="margin-bottom:10px;">
          <h2 style="margin:0;font-size:18px;">Expresso AI Assistant</h2>
          <button class="btn outline" style="padding:4px 8px;font-size:11px;" onclick="setRoute('home')">Back</button>
        </div>
        <div class="chips-row">
          <button class="chip" onclick="askAi('Mera remaining internet kitna hai?')">Remaining internet?</button>
          <button class="chip" onclick="askAi('Mujhe monthly bundles dikhao')">Monthly bundles?</button>
          <button class="chip" onclick="askAi('Sasta package suggest karo')">Sasta package?</button>
        </div>
        <div style="margin-bottom:12px;">
          ${state.aiChat.map(m => `
            <div class="card" style="padding:10px;margin-bottom:8px;background:${m.sender==='You'?'var(--primary-container)':'var(--surface)'};">
              <div style="font-size:11px;font-weight:700;">${escapeHtml(m.sender)}</div>
              <div style="font-size:13px;margin-top:2px;">${escapeHtml(m.text)}</div>
            </div>
          `).join("")}
        </div>
      `;
    } else if (state.route === "admin") {
      main.innerHTML = `
        <div class="row" style="margin-bottom:10px;">
          <h2 style="margin:0;font-size:18px;">Retailer Admin Console</h2>
          <button class="btn outline" style="padding:4px 8px;font-size:11px;" onclick="setRoute('profile')">Back</button>
        </div>
        ${state.packagesError ? `<div class="card error">${escapeHtml(state.packagesError)}</div>` : ""}
        <div class="card">
          <b style="font-size:14px;">Create Bundle</b>
          <label style="font-size:12px;font-weight:700;display:block;margin-top:8px;">Title</label>
          <input id="pkgTitle" placeholder="Monthly Supreme 40GB" />
          <label style="font-size:12px;font-weight:700;">Category</label>
          <select id="pkgCategory">
            ${["DAILY","WEEKLY","MONTHLY","CALL","SOCIAL"].map(c => `<option value="${c}">${c}</option>`).join("")}
          </select>
          <label style="font-size:12px;font-weight:700;">Price (PKR)</label>
          <input id="pkgPrice" type="number" value="500" />
          <label style="font-size:12px;font-weight:700;">Data (MB)</label>
          <input id="pkgData" type="number" value="10240" />
          <label style="font-size:12px;font-weight:700;">Minutes</label>
          <input id="pkgMinutes" type="number" value="500" />
          <label style="font-size:12px;font-weight:700;">Validity (days)</label>
          <input id="pkgValidity" type="number" value="30" />
          <button class="btn" style="width:100%;margin-top:6px;" onclick="adminCreatePackage()" ${state.adminBusy?'disabled':''}>Publish Bundle</button>
        </div>
        <h3 style="font-size:15px;margin:12px 0 8px;">All Bundles (${state.packages.length})</h3>
        ${state.packages.map(p => `
          <div class="card" style="padding:12px;">
            <div class="row">
              <b>${escapeHtml(p.name)}</b>
              <span class="badge ${p.enabled ? '' : 'admin'}">${p.enabled ? 'Enabled' : 'Disabled'}</span>
            </div>
            <div style="font-size:11px;color:var(--text-2);margin:4px 0 8px;">${escapeHtml(p.cat)} • PKR ${p.pkr} • ${(p.mb/1024).toFixed(1)} GB • ${p.mins} Mins</div>
            <button class="btn outline" style="font-size:11.5px;padding:6px 10px;" onclick="adminTogglePackage('${escapeHtml(p.id)}', ${p.enabled ? 'false' : 'true'})" ${state.adminBusy?'disabled':''}>${p.enabled ? 'Disable' : 'Enable'}</button>
          </div>
        `).join("")}
      `;
    } else if (state.route === "profile") {
      main.innerHTML = `
        <h2 style="margin:0 0 10px;font-size:18px;">Profile &amp; Settings</h2>
        <div class="card">
          <div class="row">
            <b>${escapeHtml(displayName())}</b>
            <span class="badge ${isAdmin() ? 'admin' : ''}">${escapeHtml(state.profile ? state.profile.role : 'CUSTOMER')}</span>
          </div>
          <div style="font-size:12px;color:var(--text-2);margin:4px 0 10px;">
            ${escapeHtml(state.session.user.email || "")} • SIM: ${escapeHtml(state.selectedSim)}
          </div>
          ${isAdmin() ? `<button class="btn secondary" style="width:100%;font-size:12px;margin-bottom:8px;" onclick="setRoute('admin')">Open Retailer Admin Console</button>` : ""}
          <button class="btn outline" style="width:100%;font-size:12px;" onclick="logout()" ${state.authBusy?'disabled':''}>Sign Out</button>
        </div>
      `;
    }
  }

  function renderAuthScreen() {
    const signup = state.authMode === "signup";
    const f = state.authForm;
    return `
      <div class="card notice">
        Secure authentication by Supabase. Your role (customer or retailer admin) is
        assigned by the server — it cannot be chosen or changed here.
      </div>
      ${state.authError ? `<div class="card error">${escapeHtml(state.authError)}</div>` : ""}
      ${state.authNotice ? `<div class="card success">${escapeHtml(state.authNotice)}</div>` : ""}
      <div class="card">
        <h2 style="margin:0 0 12px;font-size:18px;">${signup ? "Create Account" : "Sign In"}</h2>
        ${signup ? `
          <label style="font-size:12px;font-weight:700;">Full Name</label>
          <input id="authName" placeholder="Hamza Tariq" autocomplete="name" value="${escapeHtml(f.fullName)}" oninput="state.authForm.fullName=this.value" />
          <label style="font-size:12px;font-weight:700;">Mobile Number (+92)</label>
          <input id="authMsisdn" placeholder="03001234567" inputmode="tel" autocomplete="tel" value="${escapeHtml(f.msisdn)}" oninput="state.authForm.msisdn=this.value" />
        ` : ""}
        <label style="font-size:12px;font-weight:700;">Email</label>
        <input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email" value="${escapeHtml(f.email)}" oninput="state.authForm.email=this.value" />
        <label style="font-size:12px;font-weight:700;">Password</label>
        <input id="authPassword" type="password" placeholder="At least 6 characters" autocomplete="${signup ? "new-password" : "current-password"}" value="${escapeHtml(f.password)}" oninput="state.authForm.password=this.value" />
        ${signup ? `
          <label style="font-size:12px;font-weight:700;">Confirm Password</label>
          <input id="authConfirm" type="password" autocomplete="new-password" value="${escapeHtml(f.confirm)}" oninput="state.authForm.confirm=this.value" />
        ` : ""}
        <button class="btn" style="width:100%;margin-top:6px;" onclick="submitAuth()" ${state.authBusy?'disabled':''}>
          ${state.authBusy ? "Please wait…" : (signup ? "Create Account" : "Sign In")}
        </button>
        <div style="text-align:center;margin-top:12px;">
          <button class="link-btn" onclick="setAuthMode('${signup ? "login" : "signup"}')">
            ${signup ? "Already have an account? Sign in" : "New to Expresso? Create an account"}
          </button>
        </div>
      </div>
    `;
  }

  function subscribePkg(pid) {
    const pkg = state.packages.find(p => p.id === pid);
    if (!pkg) return;
    const sim = getActiveSim();
    if (sim.bal >= pkg.pkr) {
      sim.bal -= pkg.pkr;
      sim.dataMb = (sim.dataMb || 0) + pkg.mb;
      sim.totMb = (sim.totMb || 0) + pkg.mb;
      sim.mins = (sim.mins || 0) + pkg.mins;
      state.history.unshift({ id: "EXP-SUB-" + Math.floor(1000 + Math.random()*9000), type: "Bundle Activation", amt: pkg.pkr, desc: pkg.name });
      save();
      alert("Bundle " + pkg.name + " successfully activated!");
      setRoute("home");
    } else {
      alert("Insufficient balance! Please recharge your account first.");
    }
  }

  function doRecharge() {
    const amt = parseFloat(document.getElementById("rchAmt").value) || 0;
    if (amt > 0) {
      const sim = getActiveSim();
      sim.bal += amt;
      state.history.unshift({ id: "EXP-RCH-" + Math.floor(1000 + Math.random()*9000), type: "Top-up", amt: amt, desc: "Sandbox Recharge" });
      save();
      alert("PKR " + amt + " recharge successful!");
      setRoute("home");
    }
  }

  function claimStreak() {
    state.streak += 1;
    state.claimedToday = true;
    save();
    render();
    alert("Day " + state.streak + " streak bonus claimed! Valid for 72 hours.");
  }

  function askAi(question) {
    state.aiChat.push({ sender: "You", text: question });
    state.aiChat.push({
      sender: "Expresso",
      text: "Main Expresso demo assistant hoon. Aap apna sawal pooch sakte hain."
    });
    save();
    render();
  }

  async function init() {
    try {
      const { data } = await supabaseClient.auth.getSession();
      state.session = data.session || null;
      if (state.session) await hydrate();
    } catch (e) {
      state.session = null;
    }

    // Supabase runs this callback while holding its auth lock, so the work is
    // deferred with setTimeout — awaiting other Supabase calls here can deadlock.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      state.session = session || null;
      setTimeout(async () => {
        if (state.session) {
          await hydrate();
        } else {
          state.profile = null;
          state.packages = [];
          state.route = "home";
        }
        render();
      }, 0);
    });

    render();
  }

  init();
</script>
</body>
</html>
